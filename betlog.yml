name: BETLOG free result check
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: betlog-result-check
  cancel-in-progress: false
jobs:
  check:
    # Standard GitHub-hosted runners are free for public repositories.
    # A private copy is deliberately skipped so this setup cannot incur private-runner charges.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Update results and notify completed receipts
        env:
          BETLOG_SITE_URL: ${{ secrets.BETLOG_SITE_URL }}
          BETLOG_SITE_TOKEN: ${{ secrets.BETLOG_SITE_TOKEN }}
        run: python3 run.py
